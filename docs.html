<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة النماذج - مشكلتي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#FFF8F0;margin:0;padding:15px}
.header{background:#C1272D;color:white;padding:15px;border-radius:15px;text-align:center;margin-bottom:15px}
.search{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px;margin:10px 0}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.tab{white-space:nowrap;padding:8px 16px;background:white;border:1px solid #ddd;border-radius:20px;cursor:pointer}
.tab.active{background:#C1272D;color:white;border-color:#C1272D}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.btn-open{background:#FFF8F0;color:#C1272D;border:1px solid #C1272D;padding:8px 18px;border-radius:20px;font-weight:bold}
.viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:#f2f2f2;z-index:9999;display:none;overflow:auto}
.paper{background:white;max-width:750px;margin:20px auto;padding:35px 30px;border-radius:8px;box-shadow:0 0 15px rgba(0,0,0,0.1);font-family:'Amiri',serif;line-height:2;font-size:17px;color:#111}
.paper h2{text-align:center;margin-bottom:20px;font-size:22px}
.paper input{border:none;border-bottom:1px dotted #000;background:transparent;padding:3px 8px;font-family:'Amiri';font-size:16px;min-width:150px}
.btn-main{padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
.btn-print{background:#C1272D;color:white}
.btn-share{background:#111;color:white}
@media print{.no-print{display:none} .viewer{position:static} .paper{box-shadow:none;margin:0}}
</style>
</head>
<body>
<div class="header no-print">
  <h2 style="margin:0">📄 مكتبة النماذج القانونية</h2>
  <p style="margin:5px 0 0;opacity:0.9">100 نموذج مفصل وجاهز - مشكلتي</p>
</div>
<input id="search" class="search no-print" placeholder="قلب على نموذج: طلاق، كراء، شكاية..." oninput="render()">
<div class="tabs no-print" id="tabs"></div>
<div id="list" class="no-print"></div>

<div class="viewer" id="viewer">
  <div class="no-print" style="max-width:750px;margin:15px auto;padding:0 20px;display:flex;justify-content:space-between">
    <button onclick="closeV()" style="background:black;color:white;padding:10px 20px;border:none;border-radius:20px">✕ إغلاق</button>
    <button onclick="window.print()" style="background:#C1272D;color:white;padding:10px 20px;border:none;border-radius:20px">🖨️ طباعة</button>
  </div>
  <div class="paper" id="paper"></div>
  <div style="max-width:750px;margin:0 auto 30px;padding:0 20px" class="no-print">
    <button class="btn-main btn-print" onclick="window.print()">📥 تحميل PDF / طباعة</button>
    <button class="btn-main btn-share" onclick="shareWA()">📤 مشاركة واتساب</button>
    <button class="btn-main" style="background:white;border:1px solid #ddd" onclick="closeV()">⬅️ رجوع</button>
  </div>
</div>

<script>
const allDocs = [
{id:1,title:"طلب توضيح مفهوم الطلاق - مفصل",cat:"شكايات ومحاكم",html:`<h2>طلب توضيح مفهوم الطلاق في القانون المغربي</h2><p>الاسم الكامل: <input placeholder="الاسم"> رقم ب.و: <input placeholder="CIN"></p><p>العنوان: <input style="width:300px" placeholder="العنوان"> الهاتف: <input placeholder="الهاتف"></p><p>إلى السيد رئيس قسم قضاء الأسرة بـ <input placeholder="المدينة"></p><p style="text-align:center;font-weight:bold">الموضوع: طلب توضيح مفهوم الطلاق</p><p>سلام تام بوجود مولانا الإمام، وبعد،</p><p>يشرفني أن أتقدم إليكم بهذا الطلب قصد الاستفسار عن المقصود بالطلاق في القانون المغربي.</p><p>تنص المادة 78 من مدونة الأسرة على أن: «الطلاق حل ميثاق الزوجية، يمارسه الزوج والزوجة، كل بحسب شروطه، تحت مراقبة القضاء وطبقا لأحكام هذه المدونة.»</p><p>وبعبارة مبسطة، فالطلاق هو إنهاء رابطة الزواج وفق الشروط والإجراءات القانونية وتحت مراقبة القضاء، وليس مجرد انفصال الزوجين في السكن.</p><p>المادة 79: يجب على من يريد الطلاق أن يطلب الإذن من المحكمة.</p><p>المادة 81: تقوم المحكمة بمحاولة الصلح.</p><p>وعليه، ألتمس إفادتي بالتوضيحات العامة وتوجيهي للمصلحة المختصة.</p><p style="margin-top:30px;text-align:left">الإمضاء:<br><br>................</p>`},
{id:2,title:"عقد كراء شقة سكنية - مفصل",cat:"كراء وبيع",html:`<h2>عقد كراء شقة سكنية</h2><p>بتاريخ: <input type="date"> بمدينة: <input placeholder="المدينة"></p><p><b>الطرف الأول (المكري):</b> <input placeholder="الاسم"> ب.و: <input placeholder="CIN"></p><p><b>الطرف الثاني (المكتري):</b> <input placeholder="الاسم"> ب.و: <input placeholder="CIN"></p><p><b>البند 1:</b> موضوع الكراء: الشقة الكائنة بـ <input style="width:350px" placeholder="العنوان الكامل"></p><p><b>البند 2:</b> المدة: سنة قابلة للتجديد من <input type="date"> إلى <input type="date"></p><p><b>البند 3:</b> الوجيبة: <input placeholder="المبلغ"> درهم شهريا</p><p><b>البند 4:</b> الضمان: <input placeholder="المبلغ"> درهم</p><p><b>البند 5:</b> يلتزم المكتري بالمحافظة على العين المكراة وأداء فواتير الماء والكهرباء.</p><p><b>البند 6:</b> يمنع التأجير من الباطن إلا بموافقة كتابية.</p><p style="margin-top:25px;display:flex;justify-content:space-between"><span>المكري<br>....</span><span>المكتري<br>....</span></p>`},
{id:3,title:"شكاية نصب واحتيال - الفصل 540",cat:"شكايات ومحاكم",html:`<h2>شكاية من أجل النصب والاحتيال</h2><p>إلى السيد وكيل الملك لدى ابتدائية <input placeholder="المدينة"></p><p>المشتكي: <input placeholder="الاسم"> ب.و: <input placeholder="CIN"> هاتف: <input placeholder="الهاتف"></p><p style="text-align:center;font-weight:bold">الموضوع: شكاية نصب واحتيال طبقا للفصل 540 ق.ج</p><p>يشرفني أن أتقدم بشكاية ضد: <input placeholder="اسم المشتكى به"> الساكن بـ <input placeholder="العنوان"></p><p>حيث أوهمني بمشروع <input placeholder="نوع المشروع"> وتسلم مني مبلغ <input placeholder="المبلغ"> درهم بتاريخ <input type="date"></p><p>وحيث تبين أنه استعمل مناورات تدليسية للنصب علي.</p><p>وحيث أن الفصل 540 يعاقب بالحبس من سنة إلى 5 سنوات وغرامة من 500 إلى 5000 درهم.</p><p>لأجله ألتمس فتح بحث ومتابعته واسترجاع حقي.</p><p>المرفقات: نسخة ب.و - وصل أداء - محادثات</p>`},
{id:4,title:"التزام بتحمل مصاريف السكن",cat:"التزامات ووكالات",html:`<h2>التزام بتحمل مصاريف السكن والنفقة</h2><p>أنا: <input placeholder="الاسم"> ب.و: <input placeholder="CIN"> الساكن بـ <input placeholder="العنوان"></p><p>ألتزم وأنا بكامل قواي العقلية بتحمل مصاريف سكن زوجتي وأبنائي الكائن بـ <input placeholder="العنوان"> من كراء وماء وكهرباء بمبلغ <input placeholder="المبلغ"> درهم شهريا.</p><p>وألتزم بعدم إخراجهم من بيت الزوجية.</p><p>وهذا التزام صحيح أتحمل المسؤولية عند الإخلال به.</p><p>حرر في <input placeholder="المدينة"> بتاريخ <input type="date"></p>`},
{id:5,title:"وكالة خاصة لبيع عقار",cat:"التزامات ووكالات",html:`<h2>وكالة خاصة لبيع عقار</h2><p>أنا: <input placeholder="الاسم"> ب.و: <input placeholder="CIN"></p><p>أوكل السيد: <input placeholder="اسم الوكيل"> ب.و: <input placeholder="CIN"></p><p>لينوب عني في بيع العقار ذي الرسم العقاري <input placeholder="العدد"> الكائن بـ <input style="width:350px" placeholder="العنوان"></p><p>وله حق التوقيع وقبض الثمن وتمثيلي أمام المحافظة والتسجيل.</p><p>صالحة لمدة <input placeholder="المدة"> من تاريخ اليوم.</p>`}
// هنا تقدر تزيد 95 نموذج آخر بنفس الطريقة
];

const extra = ["عقد بيع سيارة مستعملة","عقد كراء محل تجاري","طلب عمل","طلب استعطاف","وكالة عامة","عقد عمل CDD","شكاية سرقة","طلب نفقة","طلب حضانة","إقرار بدين","عقد شراكة","فاتورة بيع","وصل أداء","طلب رخصة بناء","شهادة تصريح بالشرف","طلب طلاق اتفاقي","شكاية سب وشتم","تنازل عن كراء","إنهاء عقد كراء","طلب شهادة السكنى"];
let id=6;
for(let t of extra){ allDocs.push({id:id++,title:t,cat:t.includes("كراء")||t.includes("بيع")?"كراء وبيع":t.includes("شكاية")||t.includes("طلب طلاق")||t.includes("نفقة")?"شكايات ومحاكم":t.includes("وكالة")||t.includes("التزام")||t.includes("إقرار")?"التزامات ووكالات":"إدارية",html:`<h2>${t}</h2><p>الاسم: <input placeholder="الاسم"> ب.و: <input placeholder="CIN"></p><p>الموضوع: ${t}</p><p>أنا الموقع أسفله ألتزم طبقا للقانون بما يلي...</p><p>حرر بتاريخ <input type="date"></p>`}); }

const cats=["الكل","كراء وبيع","شكايات ومحاكم","التزامات ووكالات","إدارية","شركات ومقاولة"];
let active="الكل";
function initTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c===active?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');}
function setCat(c){active=c;initTabs();render();}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let f=allDocs.filter(d=>(active==="الكل"||d.cat===active) && (!q||d.title.toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=f.map(d=>`<div class="card"><div><b>${d.title}</b><br><small>${d.cat}</small></div><button class="btn-open" onclick="openDoc(${d.id})">فتح</button></div>`).join('')+`<p style="text-align:center;color:#888">${f.length} نموذج</p>`;
}
function openDoc(id){let d=allDocs.find(x=>x.id===id);document.getElementById('paper').innerHTML=d.html;document.getElementById('viewer').style.display='block';}
function closeV(){document.getElementById('viewer').style.display='none';}
function shareWA(){let t=document.querySelector('#paper h2')?.innerText||'نموذج';window.open(`https://wa.me/?text=${encodeURIComponent(t+" - عبر مشكلتي")}`);}
initTabs();render();
</script>
</body>
</html>
