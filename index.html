<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشكلتي - تحكم كامل</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}body{margin:0;background:#f8fafc}
.h{background:#064e3b;color:#fff;padding:20px;text-align:center;cursor:pointer}
.p{display:none;padding:14px;max-width:800px;margin:auto}.p.a{display:block}
.b{width:100%;padding:12px;background:#059669;color:#fff;border:none;border-radius:10px;margin-top:8px;font-weight:bold}
input,textarea{width:100%;padding:10px;border:2px solid #ccc;border-radius:8px;margin:5px 0}
.law{background:#fff;border-right:4px solid #059669;padding:10px;margin:8px 0;border-radius:8px}
.admin{background:#fffbeb;border:2px solid #f59e0b;padding:14px;border-radius:12px}
</style>
</head>
<body>
<div class="h" id="logo"><h1>⚖️ مشكلتي</h1><p>اضغط 5 مرات للتحكم - جميع القوانين والوثائق</p></div>
<div id="home" class="p a">
<input id="q" placeholder="قلب على قانون..." oninput="filter()"><div id="list"></div>
<button class="b" onclick="openAdmin()">🔐 دخول الإدارة</button>
</div>
<div id="admin" class="p"><div class="admin">
<h2>🔐 لوحة تحكم - انت فقط</h2>
<p>كود سري: <input id="code" type="password" placeholder="1234"><button class="b" onclick="check()">دخول</button></p>
<div id="panel" style="display:none">
<h3>➕ زيد قانون جديد</h3>
<input id="lt" placeholder="عنوان القانون"><input id="lr" placeholder="المادة"><textarea id="lx" placeholder="نص القانون"></textarea><button class="b" onclick="addLaw()">حفظ القانون</button>
<h3>➕ زيد وثيقة جديدة</h3><input id="dn" placeholder="اسم الوثيقة"><textarea id="dm" placeholder="نموذج الوثيقة"></textarea><button class="b" onclick="addDoc()">حفظ الوثيقة</button>
<h3>📊 إحصائيات</h3><div id="stats"></div>
<button class="b" style="background:#6b7280" onclick="goHome()">رجوع</button>
</div></div></div>
<div id="view" class="p"><button onclick="goHome()">⬅ رجوع</button><div id="v"></div></div>
<script>
let tap=0;document.getElementById('logo').onclick=()=>{tap++;if(tap>=5){openAdmin();tap=0}setTimeout(()=>tap=0,2000)}
let laws=JSON.parse(localStorage.getItem('laws')||'[{"t":"الكراء 67.12","r":"المادة 3","x":"يجب تحرير عقد الكراء كتابة"},{"t":"النصب","r":"540","x":"النصب يعاقب بالحبس من سنة ل 5 سنوات"}]');
let docs=JSON.parse(localStorage.getItem('docs')||'[{"n":"عقد كراء سكني","m":"أنا الموقع..."},{"n":"شكاية نصب","m":"شكاية..."}]');
function goHome(){document.querySelectorAll('.p').forEach(p=>p.classList.remove('a'));document.getElementById('home').classList.add('a');render()}
function render(){let q=document.getElementById('q').value.toLowerCase();let h='';laws.forEach((l,i)=>{if(!q||l.t.toLowerCase().includes(q))h+=`<div class="law" onclick="showL(${i})"><b>${l.t}</b><br><small>${l.r}</small></div>`});docs.forEach((d,i)=>{if(!q||d.n.toLowerCase().includes(q))h+=`<div class="law" style="border-color:#f59e0b" onclick="showD(${i})">📄 ${d.n}</div>`});document.getElementById('list').innerHTML=h}
function showL(i){document.querySelectorAll('.p').forEach(p=>p.classList.remove('a'));document.getElementById('view').classList.add('a');document.getElementById('v').innerHTML=`<div class="law"><h2>${laws[i].t}</h2><b>${laws[i].r}</b><p>${laws[i].x}</p></div>`}
function showD(i){document.querySelectorAll('.p').forEach(p=>p.classList.remove('a'));document.getElementById('view').classList.add('a');document.getElementById('v').innerHTML=`<h2>${docs[i].n}</h2><pre style="white-space:pre-wrap;background:#fff;padding:12px">${docs[i].m}</pre><button class="b" onclick="window.print()">طباعة</button>`}
function openAdmin(){document.querySelectorAll('.p').forEach(p=>p.classList.remove('a'));document.getElementById('admin').classList.add('a')}
function check(){if(document.getElementById('code').value=='1234'){document.getElementById('panel').style.display='block';document.getElementById('stats').innerHTML=`القوانين: ${laws.length}<br>الوثائق: ${docs.length}`}else alert('كود غالط - جرب 1234')}
function addLaw(){laws.push({t:document.getElementById('lt').value,r:document.getElementById('lr').value,x:document.getElementById('lx').value});localStorage.setItem('laws',JSON.stringify(laws));alert('تم حفظ القانون - دابا غيبان للناس كاملين');render()}
function addDoc(){docs.push({n:document.getElementById('dn').value,m:document.getElementById('dm').value});localStorage.setItem('docs',JSON.stringify(docs));alert('تم حفظ الوثيقة');render()}
function filter(){render()}render();
</script>
</body>
</html>
